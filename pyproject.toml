[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safegit"
version = "0.1.0"
description = "Git safety and repository protection for AI coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "SafeGit contributors" }]
keywords = ["git", "safety", "guardrail", "ai-agents", "claude-code", "opencode"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
safegit = "safegit.cli:main"

[project.urls]
Documentation = "https://github.com/OWNER/safegit#documentation"
Security = "https://github.com/OWNER/safegit/security/policy"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safegit = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
