name: SafeGit preflight

# Blocks a pull request whose staged/committed set fails the commit preflight
# (conflict markers, secrets, protected paths, oversized diffs).
#
# Read-only: this job never pushes, merges or commits.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SafeGit from this repository
        run: python -m pip install --no-deps .

      - name: Verify the installation
        run: |
          safegit version
          safegit selftest
          safegit policy validate --policy examples/policies/ci-gate.json

      - name: Classify the commands in scripts/agent-commands.txt (optional)
        if: hashFiles('scripts/agent-commands.txt') != ''
        run: |
          status=0
          while IFS= read -r command; do
            [ -z "$command" ] && continue
            safegit check --command "$command" --policy examples/policies/ci-gate.json --json \
              || status=$?
          done < scripts/agent-commands.txt
          exit $status

      - name: Commit preflight
        run: safegit preflight --repo . --strict --json
